name: Playwright tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Playwright browser
        run: |
          mvn -B exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Run tests
        run: mvn -B clean test -Dheadless=true

      - name: Upload traces from failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: traces/
          if-no-files-found: ignore
